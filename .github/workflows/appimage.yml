# Builds the AppImage (Scripts/appimage.sh) in Ubuntu 24.04, so it runs on most current distributions.
# When a release is published it adds the AppImage and its checksum to that release; run by hand
# (Actions > AppImage > Run workflow) it keeps them as a download on the run's page instead.
name: AppImage

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust, Qt and tools
        uses: actions/cache@v4
        with:
          path: /cache
          key: appimage-${{ hashFiles('Cargo.lock', 'Scripts/appimage.sh') }}
          restore-keys: appimage-

      - name: Build the AppImage
        run: CACHE=/cache Scripts/appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: release/*.AppImage*

      - name: Add it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get install -y -qq gh >/dev/null
          gh release upload "${{ github.event.release.tag_name }}" release/*.AppImage release/*.AppImage.sha256 \
            --repo "${{ github.repository }}" --clobber
